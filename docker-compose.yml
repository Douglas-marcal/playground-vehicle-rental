services:
  mysql:
    image: mysql:8.4
    container_name: vehicle-rental-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-vehicle_rental}
      MYSQL_USER: ${DB_USER:-rental}
      MYSQL_PASSWORD: ${DB_PASSWORD:-rental}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      TZ: America/Sao_Paulo
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build:
      context: .
    container_name: vehicle-rental-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-vehicle_rental}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-rental}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-rental}
      TZ: America/Sao_Paulo
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  mysql-data:
