services:
  vehicle-db:
    image: mysql:8.4
    container_name: vehicle-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: vehicle_db
      MYSQL_USER: vehicle
      MYSQL_PASSWORD: vehicle
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      TZ: America/Sao_Paulo
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - vehicle-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  customer-db:
    image: mysql:8.4
    container_name: customer-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: customer_db
      MYSQL_USER: customer
      MYSQL_PASSWORD: customer
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      TZ: America/Sao_Paulo
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3308:3306"
    volumes:
      - customer-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  vehicle-service:
    build:
      context: .
      args:
        SERVICE: vehicle-service
    container_name: vehicle-service
    restart: unless-stopped
    depends_on:
      vehicle-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://vehicle-db:3306/vehicle_db
      SPRING_DATASOURCE_USERNAME: vehicle
      SPRING_DATASOURCE_PASSWORD: vehicle
      TZ: America/Sao_Paulo
    ports:
      - "8081:8081"

  customer-service:
    build:
      context: .
      args:
        SERVICE: customer-service
    container_name: customer-service
    restart: unless-stopped
    depends_on:
      customer-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://customer-db:3306/customer_db
      SPRING_DATASOURCE_USERNAME: customer
      SPRING_DATASOURCE_PASSWORD: customer
      TZ: America/Sao_Paulo
    ports:
      - "8082:8082"

volumes:
  vehicle-db-data:
  customer-db-data:
