spring.application.name=vehicle-rental

# Banco de dados (sobrescrito por variáveis de ambiente no Docker)
spring.datasource.url=jdbc:mysql://localhost:3306/vehicle_rental
spring.datasource.username=rental
spring.datasource.password=rental

# O schema é gerenciado pelo Flyway; o Hibernate apenas valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration
